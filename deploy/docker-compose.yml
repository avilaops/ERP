# Produção do ERP no servidor applications, em /opt/erp. Sobe a aplicação e o
# assinador isolado:
# o banco é o PostgreSQL do próprio servidor, alcançado por host.docker.internal.
# Publica apenas em 127.0.0.1; quem atende a internet é o Caddy (deploy/Caddyfile.snippet).
services:
  erp:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILT_AT: ${BUILT_AT:-}
    image: erp:latest
    container_name: erp
    restart: always
    env_file: [.env]
    environment:
      ERP_PADES_TLS_CA_FILE: /run/secrets/pades-ca.pem
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:3140:3140"]
    volumes:
      - ./pades/tls/ca.pem:/run/secrets/pades-ca.pem:ro
    depends_on:
      pades-signer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3140/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  pades-signer:
    image: ghcr.io/avilaops/erp-pades-signer:${ERP_PADES_IMAGE_TAG:?informe o SHA aprovado}
    container_name: erp-pades-signer
    restart: always
    environment:
      ERP_PADES_BIND: 0.0.0.0
      ERP_PADES_SIGNER_PORT: "8443"
      ERP_PADES_SIGNER_TOKEN: ${ERP_PADES_SIGNER_TOKEN}
      ERP_PADES_TLS_CERT: /tls/cert.pem
      ERP_PADES_TLS_KEY: /tls/key.pem
      ERP_PADES_KEY_DIR: /chaves
      ERP_PADES_KEY_PASSWORD: ${ERP_PADES_KEY_PASSWORD:-}
      NODE_EXTRA_CA_CERTS: /tls/ca.pem
      ERP_PADES_TLS_NAME: pades-signer
    volumes:
      - ./pades/tls:/tls:ro
      - ./pades/chaves:/chaves:ro
    read_only: true
    tmpfs: [/tmp]
