name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por branch: a mais nova cancela a anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-ci
          # Os testes de banco só rodam em banco com nome terminado em _test.
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ERP_TEST_DATABASE_URL: postgresql://erp:erp-ci@127.0.0.1:5432/erp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Falha se algum teste for pulado: sem banco, os testes de banco não provam nada.
      - name: Testes
        run: |
          npm test 2>&1 | tee test.log
          grep -qE "^(ℹ|#) skipped 0$" test.log

      - run: npm run build
