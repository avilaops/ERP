name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pacote:
    name: Gerar pacote de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Empacotar runtime de produção
        run: ETAPA=empacotar bash deploy/empacotar.sh "$RUNNER_TEMP/standalone.tgz"

      - name: Conferir identidade do runtime
        run: bash deploy/conferir-identidade-pacote.sh "$RUNNER_TEMP/standalone.tgz" "$GITHUB_SHA"

      - name: Guardar pacote de produção
        uses: actions/upload-artifact@v4
        with:
          name: erp-production-${{ github.sha }}
          path: ${{ runner.temp }}/standalone.tgz
          if-no-files-found: error
          retention-days: 7
