name: Imagem do assinador PAdES

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/pades-signer/**"
      - "scripts/pades-signer.ts"
      - "src/lib/contract/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pades-signer-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: pades-signer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: Construir e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pades-signer/Dockerfile
          push: true
          tags: ghcr.io/avilaops/erp-pades-signer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
