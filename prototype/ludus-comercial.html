.brand .logo-full+small{margin-top:2px;padding-left:2px}
.brand.col{flex-direction:column;align-items:flex-start;gap:4px}
.mobilehead .logo-full{width:110px}
/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.plate{width:34px;height:34px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none;position:relative}
.plate::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface)}
.brand b{font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.rolecard{padding:10px 12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;color:var(--ink-2)}
.rolecard strong{display:block;font:600 16px/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.rolecard .preview{margin-top:6px;color:var(--warn);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{font-size:11px;font-weight:600;background:var(--warn);color:var(--surface);border-radius:20px;padding:0 7px;line-height:18px}
.newbtn{display:flex;justify-content:center}
.main{padding-block:24px 80px;padding-inline:28px;min-width:0;max-width:1320px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:700 34px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.saved{font-size:12px;color:var(--ink-3)}
.bottomnav{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-inline:16px;padding-block:16px 96px}
  .top h1{font-size:28px}
  .mobilehead{display:flex!important}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  .bottomnav a{flex:1;text-align:center;font-size:11px;color:var(--ink-2);text-decoration:none;padding:6px 2px;border-radius:8px;font-weight:500;position:relative}
  .bottomnav a.on{color:var(--accent);background:var(--accent-soft)}
  .bottomnav .count{position:absolute;top:0;right:8px;font-size:10px;background:var(--warn);color:var(--surface);border-radius:10px;padding:0 5px}
}
.mobilehead{display:none;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.mobilehead .brand b{font-size:19px}
.chiprole{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}

/* building blocks */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.crit{color:var(--crit);border-color:var(--crit-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel>.hd h2,.h2{font:600 18px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.panel>.bd{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi{padding:14px 16px}
.kpi .v{font:700 30px/1.05 var(--display);letter-spacing:.01em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin-bottom:16px}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner b{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}

/* forms */
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.num{text-align:right}
.suffix{position:relative}
.suffix .inp{padding-right:28px}
.suffix span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:12px;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.hint{font-size:12px;color:var(--ink-3);font-weight:400}

/* tables */
.tw{overflow-x:auto;border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right;white-space:nowrap}
.t tbody tr:hover td{background:var(--surface-2)}
.t tr.click{cursor:pointer}
.t .inp{padding:5px 7px;font-size:13px}
.t .nm{font-weight:500}
.t .sub{font-size:11px;color:var(--ink-3)}
.t tr.off td{opacity:.5}
.t tfoot td{font-weight:600;background:var(--surface-2)}

/* order */
.meter{position:relative;height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .z-good{background:var(--good)}
.meter .z-warn{background:var(--warn)}

<script id="engine">
/* ===== Motor de preços (puro, sem números da empresa embutidos) ===== */
var ENG = (function(){
  function r2(n){ return Math.round(n*100)/100; }
  function prov(c){ return (c.provisoes.perdas||0)+(c.provisoes.garantia||0)+(c.provisoes.inadimplencia||0); }
  function canalPct(c){ return (c.canal.comissao||0)+(c.canal.ads||0)+(c.canal.gateway||0); }
  function difalUF(c,uf){ if(uf==='SP') return 0; var d=c.difal.find(function(x){return x.uf===uf}); if(!d) return 0; return Math.max(0,d.aliqInterna-d.aliqSaida)+(d.fcp||0); }
  function lb(c){ return c.politica.lucroMeta/(1-c.impostos.irCsll); }
  function icmsWorst(c){
    var m=0, muf='SP';
    c.difal.forEach(function(d){ if(d.uf==='SP') return; var v=difalUF(c,d.uf); if(v>m){m=v;muf=d.uf;} });
    var inter=c.canal.icmsInter+m;
    return inter>c.impostos.icmsSP ? {v:inter,uf:muf} : {v:c.impostos.icmsSP,uf:'SP'};
  }
  function base(c){
    var w=icmsWorst(c);
    var t=canalPct(c)+c.impostos.pisCofins+prov(c)+w.v;
    var k=1-t-lb(c);
    var fv=k>0?1/k:NaN;
    var ft=fv/(1-c.politica.descVendedor);
    return {tWorst:t, worstUF:w.uf, icmsWorst:w.v, k:k, lb:lb(c), fatorVenda:fv, fatorTabela:ft, markup:ft-1};
  }
  function custo(p,c){
    var china=(p.custoAssessoria||0)*(1+(c.politica.margemSeguranca||0));
    var liq=china*(1-(p.credito||0));
    return {china:china, liquido:liq, unit:liq+(p.embalagem||0), credito:china-liq};
  }
  function cenario(c,uf,ie){
    var icms = uf==='SP' ? c.impostos.icmsSP : c.canal.icmsInter;
    var dif = (uf==='SP'||ie) ? 0 : difalUF(c,uf);
    var t = canalPct(c)+c.impostos.pisCofins+prov(c)+icms+dif;
    return {icms:icms, difal:dif, t:t, canal:canalPct(c), pisCofins:c.impostos.pisCofins, prov:prov(c)};
  }
  function chave(uf,ie){ return uf==='SP' ? 'SP' : (ie ? 'IE' : uf); }
  function chaves(c){ return ['SP','IE'].concat(c.difal.filter(function(d){return d.uf!=='SP'}).map(function(d){return d.uf})); }
  function cenarioChave(c,k){ return k==='SP'?cenario(c,'SP',false):k==='IE'?cenario(c,'XX',true):cenario(c,k,false); }
  function fatorMeta(c,k){ var s=cenarioChave(c,k); var d=1-s.t-lb(c); return d>0?1/d:null; }
  /* Tabela da equipe (sem custo) + limites do gerente */
  function publicar(c,prods,versao,agora){
    var b=base(c);
    var ativos=prods.filter(function(p){return p.ativo!==false && p.custoAssessoria>0});
    var itens=ativos.map(function(p){ var preco=r2(custo(p,c).unit*b.fatorTabela); return {id:p.id,cod:p.cod||'',nome:p.nome,preco:preco}; });
    var ks=chaves(c), ff={}, pisos={};
    ks.forEach(function(k){ var f=fatorMeta(c,k); ff[k]=f===null?null:Math.round(f*1e6)/1e6; });
    ativos.forEach(function(p){ var u=custo(p,c).unit, m={}; ks.forEach(function(k){ m[k]= ff[k]===null?null:r2(u*ff[k]); }); pisos[p.id]=m; });
    var ufs=c.difal.map(function(d){return {uf:d.uf,nome:d.nome}});
    var ticket=itens.length?itens.reduce(function(a,i){return a+i.preco},0)/itens.length:0;
    var catalogo={versao:versao, publicadoEm:agora, ipi:c.impostos.ipi, descVendedor:c.politica.descVendedor,
      validadeDias:c.politica.validadeDias||7, entradaPct:c.politica.entradaPct||0, ufs:ufs, itens:itens};
    var limites={versao:versao, publicadoEm:agora, pisos:pisos};
    return {catalogo:catalogo, limites:limites, resumo:{versao:versao, em:agora, markup:b.markup, itens:itens.length, ticket:ticket}};
  }
  /* entrada minima sugerida: pior produto, com desconto maximo do vendedor */
  /* fator da comissao sobre o valor pago pelo cliente (definido pelo app) */
  var K=null;
  function setK(k){ K=k; }
  function kCom(c){ return K!=null?K:(c.canal.comissao||0)/(1+(c.impostos.ipi||0)); }
  /* entrada necessaria: cobre China + comissao sobre a propria entrada + lucro liquido da meta */
  function entradaNec(c,china,V){ var k=kCom(c), luc=(c.politica.lucroMeta||0)*V, e=(china+luc)/(1-k); return {valor:e, china:china, lucro:luc, comissao:e*k}; }
  function entradaSugerida(c,prods){
    var b=base(c), mx=0, ipi=c.impostos.ipi||0;
    prods.forEach(function(p){ if(p.ativo===false||!(p.custoAssessoria>0)) return; var cu=custo(p,c); var v=cu.unit*b.fatorTabela*(1-c.politica.descVendedor); var e=entradaNec(c,cu.china,v).valor/(v*(1+ipi)); if(e>mx) mx=e; });
    return Math.ceil(mx*20)/20;
  }
  /* Conta exata de um pedido (so o diretor tem custo) */
  function contaPedido(c,prodMap,o){
    var s=cenario(c,o.uf,o.ie), tab=0, cst=0, china=0, cred=0, falta=0;
    o.itens.forEach(function(i){ tab+=i.preco*i.qtd; var p=prodMap[i.id]; if(!p){falta++;return;} var cu=custo(p,c); cst+=cu.unit*i.qtd; china+=cu.china*i.qtd; cred+=cu.credito*i.qtd; });
    var extra=(c.canal.taxaFixa||0)+(+o.frete||0);
    var V=tab*(1-o.desconto);
    var imp=V*(s.t-s.difal), dif=V*s.difal;
    var contrib=V-imp-dif-extra-cst;
    var ir=Math.max(0,contrib)*c.impostos.irCsll;
    var liq=contrib-ir;
    var dMeta=1-(cst+extra)/((1-s.t-lb(c))*tab);
    var dZero=1-(cst+extra)/((1-s.t)*tab);
    return {cen:s, tabela:tab, V:V, impostos:imp, difal:dif, extra:extra, custo:cst, contrib:contrib, ir:ir, liquido:liq,
      margem:V?liq/V:0, meta:c.politica.lucroMeta, dMeta:Math.max(0,dMeta), dZero:Math.max(0,dZero), china:china, credito:cred, falta:falta,
      entrada:entradaNec(c,china,V).valor, entradaDet:entradaNec(c,china,V), totalNota:V*(1+(c.impostos.ipi||0))};
  }
  /* Alcada do gerente a partir dos limites publicados */
  function limiteGerente(lim,o){
    if(!lim) return null;
    if((+o.frete||0)>0) return null; /* frete por nossa conta: decisao do diretor */
    var k=chave(o.uf,o.ie), tab=0, piso=0;
    for(var n=0;n<o.itens.length;n++){ var i=o.itens[n]; var p=lim.pisos[i.id]; if(!p) return null; if(p[k]==null) return 0; tab+=i.preco*i.qtd; piso+=p[k]*i.qtd; }
    return tab>0?Math.max(0,1-piso/tab):null;
  }
  return {r2:r2, base:base, custo:custo, cenario:cenario, chave:chave, chaves:chaves, cenarioChave:cenarioChave, fatorMeta:fatorMeta,
    publicar:publicar, contaPedido:contaPedido, setK:setK, entradaNec:entradaNec, limiteGerente:limiteGerente, entradaSugerida:entradaSugerida, difalUF:difalUF, lb:lb};
})();
if(typeof module!=='undefined') module.exports=ENG;
</script>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function prodMap(){ var m={}; (S.prods||[]).forEach(function(p){m[p.id]=p}); return m; }

function totais(o){ var cat=S.catalogo||{ipi:0}; var tab=o.itens.reduce(function(a,i){return a+i.preco*i.qtd},0); var V=tab*(1-(o.desconto||0)); var ipi=V*(cat.ipi||0); return {tabela:tab, desconto:tab-V, V:V, ipi:ipi, total:V+ipi, qtd:o.itens.reduce(function(a,i){return a+i.qtd},0)}; }

function assinatura(o){ return JSON.stringify([o.itens.map(function(i){return [i.id,i.qtd,i.preco]}),o.uf,!!o.ie,+o.frete||0]); }
function entOk(o,a){ if(!entradaBaixa(o)) return true; return a.entrada!=null && calcPag(o).pct>=a.entrada-0.0005; }
function precisaAprov(o){ var dv=S.catalogo?S.catalogo.descVendedor:0; return (o.desconto||0)>dv+1e-9 || (+o.frete||0)>0 || entradaBaixa(o); }
function motivos(o){ var dv=S.catalogo.descVendedor, m=[]; if((o.desconto||0)>dv+1e-9) m.push('desconto de '+pct(o.desconto)+' (livre até '+pct(dv,0)+')'); if((+o.frete||0)>0) m.push('frete por nossa conta'); if(entradaBaixa(o)) m.push('entrada de '+pct(calcPag(o).pct)+' (mínimo '+pct(S.catalogo.entradaPct,0)+')'); return m; }
function limG(o){ return ENG.limiteGerente(S.limites,o); }
function chaveAprov(o){ return o.dono+'~'+o.id; }
function estado(o){
  if(o.status==='fechado') return {k:'fechado',t:'Fechado',tone:'good'};
  if(o.status==='perdido') return {k:'perdido',t:'Perdido',tone:''};
  if(!o.itens.length) return {k:'vazio',t:'Sem itens',tone:''};
  if(!precisaAprov(o)) return {k:'liberado',t:'Liberado',tone:'good'};
  var sg=assinatura(o), k=chaveAprov(o), d=S.aprovDir[k], g=S.aprov[k], eps=1e-9;
  function dec(a,quem){
    if(!a||a.assinatura!==sg) return null;
    if(a.status==='aprovado' && !entOk(o,a)) return null;
    if(a.status==='aprovado' && o.desconto<=a.desconto+eps) return {k:'aprovado',t:'Aprovado pelo '+quem,tone:'good',a:a};
    if(a.status==='aprovado') return {k:'contra',t:'Aprovado até '+pct(a.desconto),tone:'warn',a:a,max:a.desconto};
    if(a.status==='recusado' && o.desconto>=a.desconto-eps && (a.entrada==null || calcPag(o).pct<=a.entrada+0.0005)) return {k:'recusado',t:'Recusado pelo '+quem,tone:'crit',a:a};
    if(a.status==='encaminhado' && o.desconto>=a.desconto-eps && o.desconto<=a.desconto+eps) return {k:'encaminhado',t:'Com o diretor',tone:'warn',a:a};
    return null;
  }
  var r=dec(d,'diretor')||dec(g,'gerente'); if(r) return r;
  if(o.solicitado) return {k:'aguardando',t:'Aguardando aprovação',tone:'warn'};
  return {k:'rascunho',t:'Precisa de aprovação',tone:'warn'};
}
function liberadoParaFechar(o){ var e=estado(o).k; return e==='liberado'||e==='aprovado'; }
function filaGerente(){ return todosPedidos().filter(function(o){ return estado(o).k==='aguardando'; }); }
function filaDiretor(){ return todosPedidos().filter(function(o){ var k=estado(o).k; return k==='aguardando'||k==='encaminhado'; }); }
function filaCount(){ if(R()==='diretor') return filaDiretor().length; if(R()==='gerente') return filaGerente().length; return 0; }

function calcAtual(){ if(!S.cfg||!S.prods) return null; return ENG.publicar(S.cfg,S.prods,((S.catalogo&&S.catalogo.versao)||0)+1,hoje()); }
function pisosMudaram(a,b,pm){ if(!a) return true; return Object.keys(b).some(function(id){ return pm[id] && a[id] && JSON.stringify(a[id])!==JSON.stringify(b[id]); }); }
function diffPublicacao(){
  var cur=calcAtual(); if(!cur) return null;
  var pub=S.catalogo; if(!pub) return {novo:true,cur:cur,mudou:cur.catalogo.itens.length,add:cur.catalogo.itens.length,rem:0,params:true};
  var pm={}; pub.itens.forEach(function(i){pm[i.id]=i});
  var mud=0, add=0, sobe=0, desce=0, cm={};
  cur.catalogo.itens.forEach(function(i){ cm[i.id]=1; var p=pm[i.id]; if(!p){add++;return;} if(Math.abs(p.preco-i.preco)>0.009||p.nome!==i.nome||p.cod!==i.cod){mud++; if(i.preco>p.preco+0.009)sobe++; else if(i.preco<p.preco-0.009)desce++;} });
  var rem=pub.itens.filter(function(i){return !cm[i.id]}).length;
  var c=cur.catalogo, params = Math.abs(c.ipi-pub.ipi)>1e-9||Math.abs(c.descVendedor-pub.descVendedor)>1e-9||c.validadeDias!==pub.validadeDias||Math.abs((c.entradaPct||0)-(pub.entradaPct||0))>1e-9||pisosMudaram(S.limites&&S.limites.pisos,cur.limites.pisos,pm);

  cpf:function(v){ v=dig(v).slice(0,11); return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4'); },
  cnpj:function(v){ v=dig(v).slice(0,14); return v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); },
  cep:function(v){ v=dig(v).slice(0,8); return v.length>5?v.slice(0,5)+'-'+v.slice(5):v; },
  celular:function(v){ v=dig(v).slice(0,11); if(v.length<=2) return v.length?'('+v:v; if(v.length<=6) return '('+v.slice(0,2)+') '+v.slice(2); if(v.length<=10) return '('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6); return '('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7); }
};
function cpfOk(v){ v=dig(v); if(v.length!==11||/^(\d)\1+$/.test(v)) return false; for(var t=9;t<11;t++){ var s=0; for(var i=0;i<t;i++) s+=+v[i]*((t+1)-i); var d=((10*s)%11)%10; if(d!==+v[t]) return false; } return true; }
function cnpjOk(v){ v=dig(v); if(v.length!==14||/^(\d)\1+$/.test(v)) return false; var calc=function(n){ var s=0,pos=n-7; for(var i=0;i<n;i++){ s+=+v[i]*pos--; if(pos<2) pos=9; } var r=s%11; return r<2?0:11-r; }; return calc(12)===+v[12] && calc(13)===+v[13]; }

var FORMAS=['PIX','Boleto','Transferência','Cartão de crédito','Cartão de débito','Cheque','Dinheiro','Financiamento','Na entrega'];
function normPag(o){ if(!o.pag){ var cat=S.catalogo||{}; var d={modo:'pct', entradaPct:cat.entradaPct||0.5, entradaValor:0, entradaForma:'PIX', entradaData:'', parcelas:1, saldoForma:'Boleto', primeiroDias:30, intervaloDias:30, obs:''}; if(Object.isFrozen(o)) return d; o.pag=d; } return o.pag; }
function addDias(iso,d){ var b=iso?new Date(iso+'T12:00:00'):new Date(); b.setDate(b.getDate()+d); return b; }
function calcPag(o){
  var p=normPag(o), t=totais(o).total;
  var ent = p.modo==='valor' ? Math.min(Math.max(0,+p.entradaValor||0),t) : t*Math.max(0,Math.min(1,+p.entradaPct||0));
  ent=Math.round(ent*100)/100;
  var saldo=Math.max(0,Math.round((t-ent)*100)/100), n=Math.max(0,Math.round(+p.parcelas||0));
  var baseIso=p.entradaData || (o.criadoEm||hoje()).slice(0,10);
  var parc=[];
  if(p.manual && p.lista && p.lista.length){
    parc=p.lista.map(function(x,k){ return {n:k+1, valor:Math.round((+x.valor||0)*100)/100, data:x.data?new Date(x.data+'T12:00:00'):null, forma:x.forma||p.saldoForma}; });
    var soma=parc.reduce(function(a,x){return a+x.valor},0);
    return {total:t, entrada:ent, pct:t?ent/t:0, saldo:saldo, parcelas:parc, p:p, manual:true, soma:soma, dif:Math.round((saldo-soma)*100)/100};
  }
  if(saldo>0.004){ if(n<1) n=1; var v=Math.floor(saldo/n*100)/100, acc=0;
    for(var k=0;k<n;k++){ var val=k===n-1?Math.round((saldo-acc)*100)/100:v; acc+=val; parc.push({n:k+1, valor:val, forma:p.saldoForma, data:p.saldoForma==='Na entrega'?null:addDias(baseIso,(+p.primeiroDias||0)+k*(+p.intervaloDias||0))}); } }
  return {total:t, entrada:ent, pct:t?ent/t:0, saldo:saldo, parcelas:parc, p:p, manual:false, soma:saldo, dif:0};
}
function addUteis(d,n){ var x=new Date(d.getTime()), k=0; while(k<n){ x.setDate(x.getDate()+1); var w=x.getDay(); if(w!==0&&w!==6) k++; } return x; }
function prazoInfo(o){ var n=Math.round(+o.prazoDias||0); if(!n) return null; var uteis=o.prazoTipo!=='corridos';
  var base=o.pag&&o.pag.entradaData?new Date(o.pag.entradaData+'T12:00:00'):null;
  var txtp=n+' dias '+(uteis?'úteis':'corridos');
  var prev=base?(uteis?addUteis(base,n):addDias(o.pag.entradaData,n)):null;
  return {n:n, uteis:uteis, texto:txtp, previsao:prev, desc:txtp+' após o pagamento da entrada'+(prev?' (previsão: '+prev.toLocaleDateString('pt-BR')+')':'')}; }
function prazoHint(o){ var pi=prazoInfo(o); if(!pi) return 'Contado a partir do pagamento da entrada.'; return pi.previsao?'Previsão de conclusão: <b>'+pi.previsao.toLocaleDateString('pt-BR')+'</b>, contando do pagamento da entrada.':'Conta a partir do pagamento da entrada. Informe a data da entrada para ver a previsão.'; }
function isoData(d){ if(!d) return ''; return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function paraManual(o){ var p=normPag(o); if(p.manual&&p.lista) return p; var c=calcPag(o); p.lista=c.parcelas.map(function(x){return {data:isoData(x.data), valor:x.valor, forma:x.forma||p.saldoForma}}); p.manual=true; return p; }
function textoPag(o){
  var c=calcPag(o), p=c.p, L=[];
  if(c.entrada>0) L.push('Entrada de '+brl(c.entrada)+' ('+pct(c.pct)+') via '+p.entradaForma+(p.entradaData?' em '+new Date(p.entradaData+'T12:00:00').toLocaleDateString('pt-BR'):' na confirmação do pedido'));
  if(c.manual){ if(c.parcelas.length){ L.push((c.entrada>0?'Saldo':'Pagamento')+' de '+brl(c.saldo)+' em '+c.parcelas.length+' parcela(s):');
      c.parcelas.forEach(function(x){ L.push('   '+x.n+'/'+c.parcelas.length+' — '+(x.data?x.data.toLocaleDateString('pt-BR'):'na entrega')+' — '+brl(x.valor)+' — '+x.forma); }); }
    if(!c.saldo && c.entrada>0) L[0]=L[0].replace('Entrada de','Pagamento à vista de'); return L; }

    else if(c.parcelas.length===1) L.push((c.entrada>0?'Saldo':'Pagamento')+' de '+brl(c.saldo)+' via '+p.saldoForma+' em '+c.parcelas[0].data.toLocaleDateString('pt-BR'));
    else L.push((c.entrada>0?'Saldo':'Pagamento')+' de '+brl(c.saldo)+' em '+c.parcelas.length+'x via '+p.saldoForma+' ('+c.parcelas.map(function(x){return x.data.toLocaleDateString('pt-BR').slice(0,5)}).join(', ')+')'); }
  if(!c.saldo && c.entrada>0) L[0]=L[0].replace('Entrada de','Pagamento à vista de');
  return L;
}

function painelAprovacao(o){

    if(est.k==='encaminhado'){ return h+'<p class="muted" style="margin:0">Encaminhado ao diretor. Aguardando decisão dele.</p></div></div>'; }

async function salvarPedido(solicitar){

  var agora=hoje(); if(!o.criadoEm) o.criadoEm=agora; o.atualizadoEm=agora; o.dono=o.dono||S.me;

    if(!need){ o.solicitado=false; }
    else if(r==='diretor'){ o.solicitado=false; await S.db.doc('aprovacoesDiretor/'+k).set({pedido:o.dono+'/'+o.id,status:'aprovado',desconto:o.desconto,assinatura:sg,entrada:calcPag(o).pct,por:S.me,em:agora,auto:true}); msg='Pedido salvo e aprovado'; }

    } else { if(solicitar){ o.solicitado=true; msg='Enviado para aprovação'; } }
    await S.db.doc('pedidos/'+o.dono).set({ultimo:agora});

async function salvarFornecedor(){
  var f=S.fornEdit, k=S.fornKey, t=f.tipo||'PJ';

  if(!nomeForn(f) && !f.razao){ toast(t==='PF'?'Informe o nome.':'Informe a razão social.'); return; }
  if(t==='EX' && !f.pais){ toast('Informe o país.'); return; }
  var key=t==='EX'?(k!=='novo'?k:'ex-'+Date.now().toString(36)):cliKey(f);
  if(k==='novo' && S.forn[key]){ toast('Este documento já está cadastrado. Abrindo o cadastro.'); go('fornecedor.'+key); return; }
  if(k!=='novo' && key!==k && S.forn[key]){ toast('Já existe outro fornecedor com este documento.'); return; }

    await S.db.doc('privado/pagar/fornecedores/'+key).set(d); S.forn[key]=d; fillFornList(); toast('Fornecedor salvo'); history.replaceState(null,'','#fornecedor.'+key); S.fornKey=key; S.params=[key]; render(); }

}

function periodo(){ var p=S.ui.dashP||'mes', hj=isoData(new Date()), m=hj.slice(0,7);

function delta(a,b,fmt){ if(b==null||!isFinite(b)||b===0||a==null) return ''; var d=a/b-1; var cls=Math.abs(d)<0.005?'eq':(d>0?'up':'dn'); return '<div class="d '+cls+'">'+(d>0?'▲':d<0?'▼':'•')+' '+pct(Math.abs(d),0)+' <span style="color:var(--ink-3);font-weight:400">vs. período anterior</span></div>'; }
function kpiD(l,v,s,d){ return '<div class="panel kpi"><div class="eyebrow">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+(d||'')+'</div>'; }
function tipAttr(t){ return ' tabindex="0" data-tip="'+esc(t)+'"'; }
function vChart(dados,fmt,opts){ /* dados: [{rot, v, tip, cls}] */
  opts=opts||{}; var mx=Math.max.apply(null,dados.map(function(d){return d.v}).concat([0])); if(mx<=0) mx=1;
  var passo=niceStep(mx/3), topo=passo*Math.ceil(mx/passo); if(!topo) topo=1;
  var gl=''; for(var g=0; g<=topo+1e-9; g+=passo){ gl+='<div class="gl" style="bottom:'+(g/topo*100)+'%"><span>'+fmt(g)+'</span></div>'; }

function niceStep(x){ if(x<=0) return 1; var e=Math.pow(10,Math.floor(Math.log10(x))), f=x/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }

function calcProd(p){

  var fSP=ENG.fatorMeta(c,'SP'), fIE=ENG.fatorMeta(c,'IE');
  return {cu:cu, tab:tab, dSP:fSP?Math.max(0,1-cu.unit*fSP/tab):0, dIE:fIE?Math.max(0,1-cu.unit*fIE/tab):0};
}

function parseColagem(txt){
  var out=[], pm=S.prods;
  txt.split(/\r?\n/).forEach(function(l){
    if(!l.trim()) return;
    var cols=l.split(/\t|;/).map(function(s){return s.trim()}).filter(Boolean); if(cols.length<2) return;
    var valor=null, chave=[];
    for(var i=cols.length-1;i>=0;i--){ if(valor===null && /\d/.test(cols[i]) && /^[R$\s\d.,]+$/.test(cols[i])) valor=num(cols[i]); else chave.unshift(cols[i]); }
    if(valor===null) return;
    var kk=chave.map(norm), hit=null;
    for(var n=0;n<pm.length && !hit;n++){ var p=pm[n]; if(kk.some(function(k){return k && (k===norm(p.cod)||k===norm(p.codFornecedor)||k===norm(p.nome))})) hit=p; }
    out.push({linha:l, valor:valor, p:hit});
  });
  return out;
}

    '<div class="panel kpi"><div class="eyebrow">Lucro líquido</div><div class="v" style="color:'+(x.margem>=x.meta-1e-6?'var(--good)':x.liquido>=0?'var(--warn)':'var(--crit)')+'">'+pct(x.margem)+'</div><div class="s">'+brl(x.liquido)+' · meta '+pct(x.meta,0)+'</div></div>'+
    '<div class="panel"><div class="bd"><div class="sum" style="font-size:13px">'+
      '<span class="muted">Desconto máx. na meta</span><b>'+pct(x.dMeta)+'</b><span class="muted">Desconto máx. sem prejuízo</span><b>'+pct(x.dZero)+'</b>'+
      '<span class="muted">Preço mínimo na meta (c/IPI)</span><span>'+brl(x.tabela*(1-x.dMeta)*(1+c.impostos.ipi))+'</span><hr>'+
      '<span class="muted">A pagar na China</span><span>'+brl(x.china)+'</span><span class="muted">Crédito de impostos que volta</span><span>− '+brl(x.credito)+'</span>'+
      '<hr><span class="muted">Entrada mínima</span><b>'+brl(x.entrada)+' · '+pct(x.totalNota?x.entrada/x.totalNota:0,0)+'</b><span class="muted small" style="grid-column:1/-1">China '+brl(x.entradaDet.china)+' + lucro da meta '+brl(x.entradaDet.lucro)+' + comissão sobre a entrada '+brl(x.entradaDet.comissao)+'</span></div></div></div></div>';

    '<div class="split"><div class="stack">'+ctrl+'<div class="panel"><div class="hd"><h2>A conta da venda</h2><span class="small muted">'+sm.q+' un. · '+sm.uf+(sm.uf!=='SP'?(sm.ie?' com IE':' sem IE'):'')+'</span></div><div class="bd"><div class="wf">'+wf+'</div></div></div></div>'+lado+'</div>';
}

/* ----- equipe ----- */
function vEquipe(){
  var todos=todosPedidos(), por={};
  todos.forEach(function(o){ var p=por[o.dono]||(por[o.dono]={n:0,f:0,v:0,ab:0}); p.n++; if(o.status==='fechado'){p.f++;p.v+=totais(o).total;} if(o.status==='orcamento')p.ab++; });
  var ids=Object.keys(por);
  var cards='<div class="grid g3 rolegrid">'+
    '<div class="panel"><span class="pill acc">Você</span><h3 style="margin-top:8px">Diretor</h3><div class="small muted">Dono do sistema</div><ul><li>Custos, fornecedores, pagamento na China</li><li>Meta de lucro, impostos, DIFAL, despesas fixas</li><li>Publica a tabela e aprova qualquer desconto</li><li>Vê lucro real de cada pedido</li></ul><div class="row" style="margin-top:12px"><button class="btn sm" data-act="viewas" data-v="diretor"'+(S.viewAs?'':' disabled')+'>Meu acesso</button></div></div>'+
    '<div class="panel"><span class="pill">Compartilhar com “Pode editar”</span><h3 style="margin-top:8px">Gerente comercial</h3><div class="small muted">Não vê custo, fornecedor nem a meta</div><ul><li>Preços com e sem IPI</li><li>Aprova descontos até a alçada de cada pedido (varia por UF)</li><li>Encaminha ao diretor o que passar disso</li><li>Vê os pedidos de toda a equipe</li></ul><div class="row" style="margin-top:12px"><button class="btn sm" data-act="viewas" data-v="gerente">Ver como gerente</button></div></div>'+
    '<div class="panel"><span class="pill">Compartilhar com “Pode interagir”</span><h3 style="margin-top:8px">Vendedor</h3><div class="small muted">Só preços e os próprios pedidos</div><ul><li>Monta pedidos e copia a proposta</li><li>Desconto livre até '+pct(S.catalogo?S.catalogo.descVendedor:0,0)+'</li><li>Acima disso, envia para aprovação</li><li>Não vê pedidos dos colegas</li></ul><div class="row" style="margin-top:12px"><button class="btn sm" data-act="viewas" data-v="vendedor">Ver como vendedor</button></div></div></div>';
  var como='<div class="panel" style="margin-top:16px"><div class="hd"><h2>Como dar acesso</h2></div><div class="bd"><ol class="ol">'+
    '<li>Clique em <b>Compartilhar</b> no topo desta página.</li>'+
    '<li>Adicione a pessoa pelo e-mail da conta Claude dela (precisa ser da sua organização).</li>'+
    '<li>Escolha <b>Pode editar</b> para o gerente comercial ou <b>Pode interagir</b> para vendedores.</li>'+
    '<li>Pronto: o acesso é reconhecido sozinho quando ela abrir o link. Para tirar, remova no mesmo menu.</li></ol>'+
    '<p class="small muted" style="margin:12px 0 0">A proteção é do servidor, não da tela: custos, fornecedores, meta de lucro e despesas ficam numa área que só o dono do sistema consegue ler. Mesmo abrindo o código da página, o gerente recebe apenas o limite de desconto de cada item e o vendedor apenas os preços.</p></div></div>';
  var tb=ids.length?'<div class="panel" style="margin-top:16px"><div class="hd"><h2>Quem está vendendo</h2></div><div class="tw"><table class="t"><thead><tr><th>Pessoa</th><th class="r">Pedidos</th><th class="r">Em aberto</th><th class="r">Fechados</th><th class="r">Fechado c/IPI</th></tr></thead><tbody>'+
    ids.map(function(u){var p=por[u];return '<tr><td>'+esc(nomeDe(u))+'</td><td class="r">'+p.n+'</td><td class="r">'+p.ab+'</td><td class="r">'+p.f+'</td><td class="r">'+brl0(p.v)+'</td></tr>'}).join('')+'</tbody></table></div></div>':'';
  return head('Equipe e acessos','Três níveis de acesso. Use “Ver como” para conferir exatamente o que cada um enxerga.')+cards+como+tb;
}

function nomeArquivo(o){ var c=norm(o.cliente||'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40); return 'Proposta-Ludus-'+o.id+(c?'-'+c:'')+'.pdf'; }
var baixando=false;
async function baixarPDF(){
  var o=S.draft; if(!o||!o.itens.length){ toast('Adicione equipamentos antes de gerar o PDF.'); return; }
  if(baixando) return; baixando=true; toast('Gerando PDF…');
  try{
    var dl=await claude.use('downloads'); if(!dl){ toast('Salvar arquivos não está disponível nesta visualização.'); return; }
    var buf=await gerarPDF(o);
    await dl.save({filename:nomeArquivo(o), data:buf});
    toast('PDF salvo');
  }catch(e){
    var c=e&&e.code;
    if(c==='declined') toast('Download cancelado');
    else if(c==='rate_limited') toast('Já existe um download aguardando confirmação.');
    else if(e&&e.message==='load') toast('Não foi possível carregar o gerador de PDF. Confira a internet e tente de novo.');
    else toast('Não foi possível gerar o PDF.');
  }finally{ baixando=false; }
}

async function excluirPedido(){
  var o=S.draft; fecharModal(); var k=chaveAprov(o);

    await S.db.doc('pedidos/'+o.dono+'/lista/'+o.id).delete();
    if(atLeast('gerente')){ try{ await S.db.doc('aprovacoes/'+k).delete(); }catch(e){} }
    if(R()==='diretor'){ try{ await S.db.doc('aprovacoesDiretor/'+k).delete(); }catch(e){} }
    if(recDoc(o)){ try{ await S.db.doc('recebimentos/'+o.dono+'/pedidos/'+o.id).delete(); if(S.receb[o.dono]) delete S.receb[o.dono][o.id]; }catch(e){} }

    S.draft=null; toast('Pedido #'+o.id+' excluído'); go('pedidos');
  }catch(e){ toast('Não foi possível excluir. Você pode não ter permissão para este pedido.'); }
