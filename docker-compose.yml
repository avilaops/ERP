# PostgreSQL para desenvolvimento local. Só isto: a aplicação roda com `npm run dev`.
# No servidor da Ávila Ops não é usado (lá o banco é o PostgreSQL do próprio servidor).
#
#   docker compose up -d
#   DATABASE_URL=postgresql://erp:erp-local@127.0.0.1:5433/erp
#   ERP_TEST_DATABASE_URL=postgresql://erp:erp-local@127.0.0.1:5433/erp_test
#
# A porta é a 5433 para não colidir com um PostgreSQL já instalado na máquina.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      # Senha só deste banco local, que escuta apenas em 127.0.0.1.
      POSTGRES_PASSWORD: erp-local
      POSTGRES_DB: erp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - erp-postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp-postgres:
